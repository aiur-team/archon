# Fail-closed Netlify configuration for the one Archon site.
#
# This is the only netlify.toml in the repository, and there is no second or
# third Netlify site behind it. The collaboration documents, the hosted
# publishing application, the renderer shell under /_render/ and the served
# agent files are all produced by one build command (templates/build --site)
# into one publish directory (the disposable _site/ tree the builder writes from
# scratch). A surface this file does not mention is a surface the builder either
# copies or does not serve -- which is the property that makes a missed copy
# step a missing page rather than a configuration that lies.
#
# Two absences are load-bearing:
#
#   * The edge gate below has no `excludedPath`. It runs on every path because
#     it is the one thing that can tell the render host from the application
#     host, and a path excluded from it is a path with no host classification
#     and no headers at all.
#   * There is no security header here. Not X-Frame-Options, not
#     Content-Security-Policy, not Referrer-Policy. The gate owns every one of
#     them, because the two hosts this site answers on need different answers
#     and a TOML rule cannot ask which host it is on. Netlify emits every
#     matching rule, and a browser handed two Content-Security-Policy headers
#     enforces their intersection, so a policy left here could only make a page
#     more dead, never more permissive. The Cache-Control rules stay: they are
#     path-based, they say the same thing on either host, and they are harmless
#     on renderer paths.

[build]
  command = "templates/build --site"
  publish = "_site"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':!*.md' ':!**/dist/**'"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.pending]
  included_files = ["**/dist/*.edit.json"]

[[edge_functions]]
  path = "/*"
  function = "gate"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production.environment]
  DOC_ENV = "production"

[context.deploy-preview.environment]
  DOC_ENV = "preview"

[context.branch-deploy.environment]
  DOC_ENV = "preview"

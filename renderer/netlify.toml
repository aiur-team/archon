# Netlify configuration for the static artifact renderer (contract C1).
#
# This is a THIRD, separate deployment: not the repo-backed `_site` build at the
# repository root, and not the `hosted/` application either. The site that serves
# it must be configured with `renderer` as its base directory so this file is the
# one that is read, and it must be served from a different *registrable site*
# from the application -- a sibling subdomain is not enough. Sibling subdomains
# share cookies and share a site for SameSite purposes, and "cookie-free" is the
# property the whole two-origin design rests on. That rule is enforced in code by
# `hosted/lib/config.mjs`, which refuses to start the application when the two
# configured origins resolve to one registrable site; this file cannot check it,
# because a deployment does not know the other deployment's origin.
#
# What is absent is the point:
#
#   * No `[functions]` block and no `functions/` directory. This origin runs no
#     server code, so there is no endpoint here to authenticate, no session to
#     forge and no store to read. A function added here would be a function
#     reachable from a page whose entire job is to render arbitrary uploaded
#     HTML, which is the one place in this design where that is unacceptable.
#   * No `[[edge_functions]]`. The legacy all-path `gate` belongs to the root
#     deployment and resolves Netlify Identity, `DOC_OWNERS` and organisation
#     role defaults. A renderer that consulted an identity provider would have
#     an identity to steal.
#   * No `[[headers]]` block. The renderer's security headers are generated by
#     its build into the published tree, because `frame-ancestors` has to name
#     the exact configured application origin and a committed TOML cannot know
#     it. Declaring a second, partial header set here would leave two
#     authorities that can disagree, and the one that would win is the one
#     nobody read. In particular there is deliberately no `X-Frame-Options`:
#     `SAMEORIGIN` would forbid the one framing this design requires.
#   * No environment values. `HOSTED_APP_ORIGIN` and `HOSTED_RENDER_ORIGIN` are
#     set by an operator in the Netlify site environment, and this deployment
#     reads no secret at all -- there is none it could need. `GITHUB_CLIENT_ID`,
#     `GITHUB_CLIENT_SECRET` and `HOSTED_PUBLISH_ENABLED` belong to the
#     application site and must not be set on this one.
#
# The build command below is the renderer's own entry point, invoked from this
# deployment's base directory. This file selects and invokes that build; it does
# not own it. The bootstrap sources, the generated header set and the exact
# content security policy are AHU-005's, and `hosted/OPERATIONS.md` documents the
# settings an operator enters rather than restating that policy.

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true

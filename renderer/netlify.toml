# Netlify configuration for the static artifact renderer (contract C1/C4).
#
# This is a THIRD, separate deployment: not the repo-backed `_site` build at the
# repository root, and not the `hosted/` application either. It must be
# configured with `renderer` as its base directory so this file is the one that
# is read, and it must be served from a different registrable site from the
# application -- not a sibling subdomain. Sibling subdomains share cookies and
# share a site for SameSite purposes, and "cookie-free" is the property the whole
# design rests on. `netlify/lib/hosted/config.mjs` refuses to start the application when
# the two origins share a site, which is where that rule is enforced.
#
# What is absent is the point:
#
#   * No `[functions]` block and no `functions/` directory. This origin runs no
#     server code, so there is no endpoint here to authenticate, no session to
#     forge and no store to read. A function added here would be a function
#     reachable from a page that renders arbitrary HTML.
#   * No `[[edge_functions]]`. The legacy all-path `gate` belongs to the root
#     deployment and resolves Netlify Identity and `DOC_OWNERS`; a renderer that
#     consulted an identity provider would have an identity to steal.
#   * No `[[headers]]` block. The security headers are generated into
#     `dist/_headers` by the build, because `frame-ancestors` has to name the
#     exact configured application origin and a committed TOML cannot know it.
#     Splitting the header set between here and there would leave two authorities
#     that can disagree, and the one that would win is the one nobody read.
#     In particular there is deliberately no `X-Frame-Options`: `SAMEORIGIN`
#     would forbid the one framing this design requires.
#   * No environment values. `HOSTED_APP_ORIGIN` and `HOSTED_RENDER_ORIGIN` are
#     set by an operator in the Netlify site environment. This deployment reads
#     no secret at all -- there is none it could need -- so nothing here is ever
#     a secret in git.
#   * No dependencies and no lockfile. The build is one Node script with no
#     imports beyond `node:` builtins, which is what keeps the published tree
#     five files that a reviewer can read in full.

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true

name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is public and was extracted from a private one.
      # The scrub gate runs first and independently: if private context is
      # present, nothing else about the build matters.
      - name: scrub gate
        run: scripts/scrub-check.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The deploy tree (netlify/, netlify.toml, package.json, package-lock.json)
      # is what the P4-S connect tool (#80) copies verbatim. npm ci fails if the root
      # lockfile is missing or out of sync with package.json, so this step
      # keeps the committed lockfile honest without changing any dependency.
      - name: root lockfile is in sync
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Nothing else in this workflow imports netlify/, so until this step
      # existed a function could name an import that does not resolve, or
      # destructure an export its dependency does not emit, and every gate
      # stayed green (#107). Linking is the gate: ESM resolves named imports
      # before it evaluates anything. Modules are loaded, never invoked.
      #
      # The position of this step is load-bearing: it runs before anything
      # compiles or installs a workspace, because a deploy carries only
      # netlify/, netlify.toml and the root lockfile. Moving it after a build
      # would make it pass by arranging a condition production never provides.
      - name: every deploy module loads
        run: node scripts/check-function-modules.mjs

      # `hosted/` is a SECOND Netlify deployment with its own lockfile, its own
      # dependency set and no share of the root deploy tree. The steps below are
      # its equivalent of the two above: a clean install first, then a link
      # check against exactly what that install produced, then the tests.
      #
      # Step order is NOT what isolates the two trees, and an earlier version of
      # this comment claimed it was. Node's resolution walks up, so the root
      # `npm ci` two steps above puts the repository's own `node_modules` on the
      # resolution path of every file under `hosted/` no matter where these
      # steps sit. What actually delivers "a hosted function cold-starts with
      # nothing but its own `node_modules`" is a rule inside the gate: it
      # records what Node resolves for each import and fails when a bare
      # specifier lands anywhere but `hosted/node_modules`. That is checkable
      # rather than positional, and `check-hosted-modules.test.mjs` proves it
      # fails on a package installed only at the root.
      - name: hosted lockfile is in sync
        run: npm --prefix hosted ci --ignore-scripts --no-audit --no-fund

      - name: every hosted module loads
        run: node scripts/check-hosted-modules.mjs

      # The gate above is a silent-pass mechanism: an edit that empties its
      # fault list leaves CI green forever, and the symptom is a hosted deploy
      # that quietly carries the legacy identity tree. This runs the gate
      # against planted faults and requires it to fail on each one.
      - name: the hosted module gate can fail
        run: node --test scripts/check-hosted-modules.test.mjs

      - name: hosted contract tests
        run: node --test hosted/test/contracts.test.mjs

      # The hosted auth tree. Every one of these runs against injected
      # dependencies -- an in-memory store with the real conditional-write
      # semantics, a hand-driven clock and a fake provider -- so the whole of
      # AHU-003 is verified with no GitHub credential, no network and no
      # operator secret. A missing secret therefore cannot skip any of it.
      #
      # These live in `hosted/test/` rather than beside their sources because
      # `hosted/lib/` and `hosted/functions/` are deploy directories: the module
      # gate above refuses a file there that imports `node:test` or reaches into
      # `hosted/test/`, and Netlify would publish `hosted/functions/*.test.mjs`
      # as a live route. Same four suites, one directory across.
      - name: hosted auth tests
        run: |
          node --test \
            hosted/test/identity.test.mjs \
            hosted/test/auth-store.test.mjs \
            hosted/test/github-oauth.test.mjs \
            hosted/test/auth-routes.test.mjs

      # AHU-004's publication state. Three suites rather than one because they
      # test four different things: the provider adapter's conditional-write
      # and readback handling, the state machine's races and deadlines, the
      # agent endpoints' transport rules, and the artifact upload route's byte
      # handling and retry protocol. Named literally, like every
      # other test file in this workflow, so a file that stops being emitted
      # fails loudly instead of matching a glob of nothing.
      #
      # These run under `hosted/test/` rather than beside the modules they
      # cover: `scripts/check-hosted-modules.mjs` refuses a `*.test.mjs` inside
      # `hosted/lib/` or `hosted/functions/`, because a deployed module that
      # could import a fixture is one edit away from returning a fake success.
      #
      # `--test-timeout` bounds each test. These suites verify compare-and-set
      # loops, and a regression that stops one of them terminating would
      # otherwise hang the job until the runner's own limit killed it with no
      # failing test named; thirty seconds is far above the whole suite's
      # runtime and far below that.
      - name: hosted publication tests
        run: >-
          node --test --test-timeout=30000
          hosted/test/publication-store.test.mjs
          hosted/test/publications.test.mjs
          hosted/test/publications-agent.test.mjs
          hosted/test/publication-browser-binding.test.mjs
          hosted/test/publications-browser.test.mjs
          hosted/test/document-routes.test.mjs
          hosted/test/publications-artifact.test.mjs

      # The approval page is defined in terms of `location.hash`, `history`, a
      # `__Host-` cookie surviving a real navigation out to a provider and back,
      # and an agent-chosen title arriving as text. None of those can be
      # asserted against a hand-written DOM without asserting against an
      # approximation of one, so this drives a real Chromium against the real
      # handlers and the real `public/publish/authorize.html`.
      #
      # It gets its own step because it installs a pinned Playwright and one
      # Chromium into a temporary root first -- minutes of network on a cold
      # runner, which has nothing to do with any individual assertion. The
      # per-test timeout inside the file is the real budget: a test's own
      # `timeout` overrides `--test-timeout` in both directions. The value here
      # matches it so a reader of this step is not told a different number.
      #
      # This step is not decoration. It is what caught the sign-in flow being
      # dead in every browser: `Referrer-Policy: no-referrer` makes a same-origin
      # form POST arrive with `Origin: null`, which the exact-origin check
      # refused. Every route suite in this workflow was green while that was
      # true, because they all build their requests by hand.
      - name: hosted approval page browser matrix
        run: >-
          node --test --test-timeout=1500000
          hosted/test/approval-browser.test.mjs

      # AHU-011's operational half: the publish-disable policy, the two per-IP
      # rate rules, the production origin/registrable-site rules, the redacted
      # operator environment example, the renderer deployment definition and the
      # read-only census projection.
      #
      # It is a standalone runner rather than a `node --test` file because it
      # spans four surfaces that no single suite owns, and because the rate rules
      # have to be read off the handler modules' real `config` exports -- the
      # object Netlify packages -- rather than off the TOML or off the runbook
      # prose. It contacts no provider, reads no credential and needs no network.
      #
      # One contract here is asserted against a synthetic fixture by choice, not
      # by necessity: AHU-005's renderer build has merged, and
      # `scripts/test-hosted-renderer.mjs` already drives it for real. This
      # runner asserts only the *invocation* contract around it -- that the
      # command `renderer/netlify.toml` declares, run from the declared base
      # directory, emits the declared publish directory -- and does so against a
      # fixture so that two runners are not in charge of one output.
      #
      # It runs after the hosted install because it links against `hosted/lib`,
      # which resolves `tldts` out of `hosted/node_modules`.
      - name: hosted operations gate
        run: node scripts/test-hosted-operations.mjs

      # AHU-013's live acceptance gate. The capstone it belongs to cannot be
      # closed by anything in this workflow -- it is about GitHub's real
      # callback, real deployed routing and an installed public release -- so
      # what CI proves here is the opposite property: that the runner refuses to
      # report a live result when the operator prerequisites are absent, which
      # is exactly the state every build runs in. A runner that started exiting
      # 0 without them would turn "blocked" into "passed" silently, so a zero
      # exit fails this step.
      #
      # It imports `hosted/lib` and `renderer/scripts/build.mjs` rather than
      # restating either policy, so it runs after the hosted install above.
      - name: live acceptance refuses without operator prerequisites
        run: |
          if node scripts/test-hosted-live.mjs; then
            echo "scripts/test-hosted-live.mjs reported a live result with no operator prerequisites" >&2
            exit 1
          fi

      # The rules that refusal is made of, one planted violation at a time,
      # against an injected fetch so no probe leaves the runner.
      - name: the live acceptance gate can fail
        run: node --test --test-timeout=30000 scripts/test-hosted-live.test.mjs

      # The hosted deployment's safety is mostly in what its TOML does NOT say:
      # no edge function (the legacy all-path gate resolves Netlify Identity and
      # DOC_OWNERS, the wrong authorities here), no build command (so a deploy
      # never compiles docbuild), no `included_files` (which would widen the
      # deploy tree back over `netlify/` with CI green), and no environment
      # beyond the Node version, since every C6 key is operator-set. Absences
      # are exactly what a diff review skims, so they are asserted here the same
      # way the root deployment's edge gate is.
      - name: hosted deploy config is fail-closed
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const toml = readFileSync("hosted/netlify.toml", "utf8");
          /* Comments carry the reasons for every absence below, and matching
             them would pass a file that says one thing and deploys another. */
          const live = toml.replace(/^\s*#.*$/gm, "");

          assert.match(live, /^\s*publish\s*=\s*"public"\s*$/m, "publish must be public/");
          assert.match(live, /^\s*directory\s*=\s*"functions"\s*$/m, "functions.directory must be functions/");
          assert.match(live, /^\s*NODE_VERSION\s*=\s*"[^"]+"\s*$/m, "build.environment must pin NODE_VERSION");

          assert.doesNotMatch(live, /\[\[edge_functions\]\]/, "hosted carries no edge function");
          assert.doesNotMatch(live, /^\s*command\s*=/m, "hosted has nothing to build");
          assert.doesNotMatch(live, /included_files/, "included_files would widen the deploy tree");

          const environment = live.match(/^\[build\.environment\]$([\s\S]*?)(?=^\[|\Z)/m);
          assert.ok(environment, "missing [build.environment]");
          const keys = [...environment[1].matchAll(/^\s*([A-Za-z_][\w]*)\s*=/gm)].map((match) => match[1]);
          assert.deepEqual(keys, ["NODE_VERSION"], "no secret or C6 key belongs in git");
          console.log("PASS  hosted deploy config is fail-closed");
          NODE

      # notify() runs after the authoritative write, so a body it rejects that
      # the store accepted is a 500 for a comment that already landed. The two
      # grammars are only kept in step by being asserted against each other.
      - name: notify() accepts what the store accepts
        run: node netlify/lib/notify.test.mjs

      - name: typecheck
        run: npm --prefix templates/docbuild ci --no-audit --no-fund && npm --prefix templates/docbuild run check

      # A function that imports `templates/docbuild/dist/` cannot load: `dist/`
      # is gitignored, and the P4-S connect tool copies only the deploy tree
      # into a connected site. The two modules `netlify/functions/edit.mjs`
      # needs are therefore vendored into `netlify/lib/` as generated, tracked
      # copies, and this step holds those copies equal to the canonical build.
      # It also asserts the invariant behind them — no relative import anywhere
      # under `netlify/` may leave `netlify/` — so the defect cannot come back
      # by a route other than the one it arrived by.
      #
      # It runs after the typecheck step, whose `npm ci` prepare build is what
      # emits the canonical `dist/` the copies are compared against.
      - name: the deploy tree is self-contained
        run: node scripts/vendor-netlify-lib.mjs

      # Both copies of the converter, against the same 12 canonical rows: the
      # hand-written browser twin in `templates/base/edit.js`, and the vendored
      # server copy the edit endpoint imports. The second run is implied by the
      # step above while that step exists — equal bytes convert equally — and is
      # kept so the acceptance property is asserted directly rather than
      # inferred from the order of two other gates.
      - name: Check inline converter parity
        run: |
          node scripts/check-inline-md.mjs
          node scripts/check-inline-md.mjs \
            --fixture templates/fixtures/inline.json \
            --module netlify/lib/inline-md.mjs

      # The unit tests were written before anything ran them, and a test that
      # never executes cannot hold a regression out. Every file is named
      # explicitly rather than globbed: `node --test` treats an unmatched
      # pattern as a glob that matches nothing and exits 0, and a glob that
      # still matches some other test file would go green with this one
      # silently dropped. A literal path that stops being emitted fails loudly.
      # Add new test files to this list.
      #
      # "Add new test files to this list" was missed three times running, so the
      # list is now enforced rather than remembered: this step fails when a
      # tracked test file exists that no run step below names (#107).
      - name: every test file is wired into CI
        run: node scripts/check-test-inventory.mjs

      - name: unit tests
        run: |
          npm --prefix templates/docbuild run build
          node --test \
            templates/docbuild/dist/index.test.js \
            templates/docbuild/dist/anchors.test.js \
            templates/docbuild/dist/hosted-profile.test.js \
            templates/docbuild/dist/publish.test.js
          node --test scripts/connect.test.mjs
          node --test scripts/temp-roots.test.mjs
          node --experimental-vm-modules --test netlify/lib/identity.test.mjs
          # The permanent regression runners are standalone supervisors, not
          # `node --test` files: each one names itself, forks its own matrices
          # and prints its own PASS lines. They are heavier than the docbuild
          # tests -- test-p4-a.mjs installs a pinned Playwright and Chromium
          # into a temporary root -- which is the price of the write paths
          # having a gate at all. Anything that needs the TypeScript compiler
          # relies on the typecheck step above having installed it.
          # test-p4-a.mjs ran through allow-known-runner-failure.mjs until
          # #124: its browser matrix measured the selection tooltip without
          # asserting that it found one, which held locally and died with a
          # TypeError in Actions. The measurement now waits for a laid-out host
          # and names the selector when there is none, so the allowance is gone
          # and every runner is invoked directly.
          #
          # test-p4-j.mjs names the mode it runs: `contract` is the hermetic
          # one, and `hosted` needs operator credentials no build has. This
          # invocation runs with `P4J_BASE` unset, which means its reviewed-base
          # gate is SKIPPED and the working tree is what is under test -- the
          # runner says so on stderr every build. That is deliberate: the only
          # commits that satisfy the gate live on the ticket branch and do not
          # survive the squash merge, so a `P4J_BASE` set here would abort every
          # push build on `main` (#133).
          #
          # test-p4-l.mjs takes the same shape: `contract` is the hermetic
          # matrix pair, and the rendered oracle is its own entry point because
          # it measures laid-out geometry rather than state. The hosted oracle
          # needs operator credentials no build has, so CI runs it only far
          # enough to prove it refuses to touch a provider account without
          # them -- which is also what names the file for the inventory gate.
          #
          # test-p4-k.mjs has one mode and needs no credential; its sibling
          # browser runner installs its own pinned Playwright and Chromium the
          # same way test-p4-a.mjs does.
          node scripts/test-p4-a.mjs
          node scripts/test-p4-b.mjs
          node scripts/test-p4-i.mjs
          node scripts/test-p4-j.mjs contract
          node scripts/test-p4-l.mjs contract
          node scripts/test-p4-l-browser.mjs
          if node scripts/test-p4-l-hosted.mjs; then
            echo "scripts/test-p4-l-hosted.mjs ran without operator credentials" >&2
            exit 1
          fi
          node scripts/test-p4-m.mjs
          node scripts/test-p4-n.mjs
          node scripts/test-p4-p.mjs
          node scripts/test-p4-o.mjs
          node scripts/test-p4-q.mjs
          node scripts/test-p4-t.mjs
          # The four paths #125 left holding hand copies of the access-row
          # validator had no test of any kind before #128. This runner drives
          # the capability matrix through each of them, so neutering the shared
          # validator -- or any one of the four call sites -- fails here.
          #
          # The gate on the shared access-row validator: the exact set of
          # role-resolving modules that keep a private copy, plus the runtime
          # matrix for the two surfaces #135 folded onto validateAccessRow().
          # It is the only thing that runs netlify/edge-functions/gate.ts at
          # all -- the edge function is TypeScript for Deno, so the runner
          # transpiles it with the TypeScript the typecheck step installed.
          node scripts/test-access-row.mjs
          node --experimental-vm-modules scripts/test-p4-k.mjs contract
          node scripts/test-p4-k-browser.mjs
          # AHU-005's renderer oracle. It builds `renderer/` into a temporary
          # root, serves that output on its own loopback origin with the
          # generated `_headers` applied to every response, and drives the
          # isolation matrix against a separate account origin and a third
          # adversary origin. Two engines rather than one: the design rests on a
          # content-security policy being inherited into a sandboxed `srcdoc`
          # document, and "one engine does this correctly" is not the same claim
          # as "browsers do this". It installs its own pinned Playwright,
          # Chromium and Firefox the way the two runners above do, and it needs
          # the `hosted` install several steps up, because it holds the
          # renderer's copy of the render-message contract equal to
          # `hosted/lib/contracts.mjs` before it starts a browser.
          node scripts/test-hosted-renderer.mjs
          # AHU-009's private-document oracle. It runs the real viewer, read,
          # session and logout handlers on one loopback origin over a
          # deterministic identity store and AHU-004 complete records, serves
          # the renderer build on a second, and gives an artifact an adversary
          # origin to try to reach on a third. Half of its cases are HTTP -- the
          # owner/stranger/missing/malformed matrix, HEAD, conditional requests,
          # and the rule that a denial's whole response carries no marker of the
          # document it refused -- and half are browser: the artifact has no
          # authority over the account page, a forged readiness message from the
          # renderer origin gets nothing, and sign-out revokes server-side.
          node scripts/test-hosted-owner-viewer.mjs

      # AHU-012's integrated gate. Every other step above proves one producer
      # against a seam that producer's own ticket controls: a client against a
      # protocol fixture, a handler against a store double, a package against a
      # fixture service. Each is true and none of them says that the approval a
      # person clicked, the upload an agent sent and the document that person
      # reads afterwards refer to the same record and the same account. This one
      # does, by assembling the merged producers and controlling exactly one
      # thing -- the identity provider upstream.
      #
      # It is a standalone runner rather than a `node --test` file for the same
      # reason the other supervisors are: it installs a pinned Playwright and
      # Chromium into a temporary root, packs and installs the real client
      # package outside the checkout, and starts five servers. It prints one
      # PASS line naming the engine and the number of cases that completed, and
      # its supervisor checks that count -- a worker that returned early cannot
      # print a line that reads like a full run.
      #
      # It needs no credential and contacts no provider: `github.com` is
      # resolved, for its browser only, to a loopback fixture that validates the
      # client id, the redirect URI, the PKCE challenge and the client secret.
      # Three earlier steps are prerequisites and are invisible from here: the
      # hosted install (the handlers resolve `@netlify/blobs` and `tldts` out of
      # `hosted/node_modules`, and the local blob server comes from the same
      # package), the typecheck install (`npm pack` runs prepack then prepare,
      # and prepare is `tsc`), and `openssl`, which the runner uses to mint the
      # one-name certificate its provider fixture needs to complete a TLS
      # handshake.
      - name: hosted publishing integration gate
        run: node scripts/test-hosted-integration.mjs

      # AHU-010's clean-consumer proof. Every other gate above runs inside this
      # checkout, where `templates/base/`, `templates/skeleton/` and
      # `skills/archon-doc/` are all on disk and the builder's own `repoRoot()`
      # walk finds them -- so a source-checkout assumption passes all of them
      # and fails for the first person who runs `npm install`. This runner packs
      # the real tarball, installs it into a temporary directory outside the
      # repository, and drives the installed `archon` (and its `docbuild` alias) and `archon-publish`
      # exactly as the packaged skill tells a new user to.
      #
      # It is a step of its own rather than a line in `unit tests` because it is
      # the only gate that needs `npm pack` and a network install, and a failure
      # here means something different from a failing unit test: the code is
      # fine and the *package* is not.
      #
      # Its publisher half runs against a local protocol fixture on loopback. It
      # proves packaging, not service behaviour: nobody signs in, no account
      # exists, and every token and code it uses is invented. AHU-013 owns the
      # live claim. The fixture is not a hand-written stand-in for the server's
      # rules: it validates the start descriptor through the real
      # `hosted/lib/contracts.mjs`, the way `scripts/test-hosted-renderer.mjs`
      # binds the renderer to the same module, so a renamed descriptor key fails
      # here rather than on somebody's first real publish.
      #
      # Two earlier steps are prerequisites and are invisible from here: the
      # `hosted lockfile is in sync` install (contracts.mjs resolves `tldts` out
      # of `hosted/node_modules`) and the `typecheck` install (`npm pack` runs
      # prepack then prepare, and prepare is `tsc`). Both failures name
      # themselves rather than surfacing as an unexplained crash.
      - name: the published package works for a clean consumer
        run: node scripts/test-publish-package.mjs

      # P4-K's hosted oracle creates and deletes a real Netlify site and needs
      # operator credentials no build has. It is named here so the test
      # inventory gate above sees it wired, and it runs only when an operator
      # supplies the credentials -- never on an untrusted pull request.
      - name: P4-K hosted acceptance (operator credentials only)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -n "${NETLIFY_AUTH_TOKEN:-}" ]; then
            node scripts/test-p4-k-hosted.mjs
          else
            echo "SKIP scripts/test-p4-k-hosted.mjs (no operator credentials)"
          fi

      - name: edge gate config is fail-closed
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const toml = readFileSync("netlify.toml", "utf8");
          const marker = "[[edge_functions]]";
          const start = toml.indexOf(marker);
          assert.notEqual(start, -1, "missing [[edge_functions]] block");
          assert.equal(toml.indexOf(marker, start + marker.length), -1, "expected exactly one edge_functions block");
          const tail = toml.slice(start + marker.length);
          const nextBlock = tail.search(/^\[/m);
          const block = nextBlock === -1 ? tail : tail.slice(0, nextBlock);
          assert.match(block, /^\s*path\s*=\s*"\/\*"\s*$/m);
          assert.match(block, /^\s*function\s*=\s*"gate"\s*$/m);
          const line = block.match(/^\s*excludedPath\s*=\s*\[(.*)\]\s*$/m);
          assert.ok(line, "missing excludedPath");
          const quoted = [...line[1].matchAll(/"([^"]+)"/g)].map((match) => match[1]);
          assert.deepEqual(quoted, ["/login/*", "/api/*", "/_assets/*"]);
          assert.equal(line[1].replace(/"[^"]+"/g, "").replace(/[\s,]/g, ""), "");
          console.log("PASS  edge gate config is fail-closed");
          NODE

      - name: complete site builds
        run: templates/build --site

      - name: every document rebuilds byte-identically
        run: templates/check-dist

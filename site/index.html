<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon</title>
<meta name="description" content="Claude Artifacts merged with auth, editing, and live collaboration.">
<link rel="alternate" type="text/markdown" href="/AGENTS.md" title="Instructions for agents">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Light is the bare :root so no colour exists only inside a media block. */
  :root {
    --bg: #e7d6b2;
    --fg: #2a2520;
    --muted: #5f5645;
    --accent: #1f57c4;
    --hairline: rgba(42, 37, 26, 0.12);
    --pill-bd: rgba(42, 37, 26, 0.16);
    --pill-bg: rgba(42, 37, 26, 0.035);
    --line: rgba(42, 37, 26, 0.17);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1b1e;
      --fg: #edeef0;
      --muted: #8c8d93;
      --accent: #2f86ff;
      --hairline: rgba(221, 226, 235, 0.10);
      --pill-bd: rgba(221, 226, 235, 0.13);
      --pill-bg: rgba(221, 226, 235, 0.03);
      --line: rgba(221, 226, 235, 0.14);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  html { background: var(--bg); }
  body {
    position: relative;
    background: var(--bg);
    color: var(--fg);
    font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    text-align: center;
  }

  /* The banner sits in normal flow above the stage, so it can never overlap
     the centred content at any width. */
  .banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 10px;
    padding: 10px 44px 10px 16px;
    position: relative;
    z-index: 1;
    border-bottom: 1px solid var(--hairline);
    /* The tint is painted over the page colour rather than straight onto the
       page. `--pill-bg` is a 3%-alpha wash, so on its own the flow field behind
       the banner reads straight through it and the band looks like part of the
       diagonals. Layering it on an opaque `--bg` gives the same tint over a
       solid band, which is how the matching announcement reads on aiur.team,
       where no field runs behind it. */
    background: linear-gradient(var(--pill-bg), var(--pill-bg)), var(--bg);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: clamp(11px, 1.5vw, 13px);
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  /* `display: flex` above outranks the user-agent's `[hidden] { display: none }`,
     so the hidden attribute needs restating or a dismissed banner stays on screen. */
  .banner[hidden] { display: none; }
  .banner b { font-weight: 500; color: var(--fg); }
  .banner a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .banner a:hover { text-decoration-thickness: 2px; }
  .banner-close {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .banner-close:hover { color: var(--fg); background: var(--pill-bd); }
  .banner-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Sign in sits in normal flow, right-aligned, directly after the banner. When
     the banner is shown it lands beneath it rather than over it; when the banner
     is hidden it rides near the top of the page. Colours are the shared tokens. */
  .site-signin {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    padding: 0.75rem clamp(0.9rem, 3vw, 1.25rem) 0;
    margin: 0;
    position: relative;
    z-index: 1;
  }
  /* The failed-sign-in message wraps to its own line under the button and shares
     the page's error tone. Empty by default, so it occupies no space until the
     splash is reached with a status word. */
  .signin-status {
    flex-basis: 100%;
    margin: 0.4rem 0 0;
    text-align: right;
    font-size: 0.85rem;
    color: #b3261e;
    max-width: 32rem;
    margin-left: auto;
  }
  .signin-status:empty { display: none; }
  .site-signin button {
    cursor: pointer;
    font: 500 0.95rem/1 "Space Grotesk", system-ui, sans-serif;
    color: var(--accent);
    border: 1px solid var(--pill-bd);
    background: var(--bg);
    padding: 0.55rem 1rem;
    border-radius: 999px;
  }
  .site-signin button[disabled] { cursor: default; opacity: 0.6; }
  .site-signin button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* nav:start */
  /* The signed-in half of the nav: the visitor's picture and handle, and a menu
     whose only item signs them out. It is written here and on the onboarding
     page as the same block of characters, and a test compares the two, because
     two hand-written pages cannot share a stylesheet and "somebody copied it
     once" is how the two ended up disagreeing about the Sign in control before.

     Every selector is qualified with `.site-signin` so it outranks the
     `.site-signin button` pill rule above rather than losing to it on
     specificity - which is what a bare `.account-trigger` would do, silently,
     leaving the account pill wearing the Sign in button's colours. */
  .site-signin .site-account { position: relative; display: flex; }
  .site-signin .site-account[hidden],
  .site-signin form[hidden] { display: none; }
  .site-signin .account-trigger {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    max-width: min(60vw, 15rem);
    cursor: pointer;
    font: 500 0.95rem/1 "Space Grotesk", system-ui, sans-serif;
    color: var(--fg);
    border: 1px solid var(--pill-bd);
    background: var(--pill-bg);
    padding: 0.3rem 0.8rem 0.3rem 0.35rem;
    border-radius: 999px;
  }
  .site-signin .account-trigger:hover { border-color: var(--accent); color: var(--accent); }
  /* The picture and its fallback occupy the same box, so the pill keeps its
     width whether or not the identity published an avatar. */
  .site-signin .account-avatar,
  .site-signin .account-initial {
    flex: none;
    width: 1.65rem;
    height: 1.65rem;
    border-radius: 999px;
    border: 1px solid var(--pill-bd);
    background: var(--bg);
  }
  .site-signin .account-avatar { display: block; object-fit: cover; }
  .site-signin .account-avatar[hidden],
  .site-signin .account-initial[hidden] { display: none; }
  .site-signin .account-initial {
    display: grid;
    place-items: center;
    font-size: 0.8rem;
    line-height: 1;
    color: var(--accent);
    text-transform: uppercase;
  }
  .site-signin .account-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .site-signin .account-menu {
    position: absolute;
    top: calc(100% + 0.4rem);
    right: 0;
    z-index: 4;
    min-width: 9rem;
    padding: 0.25rem;
    border: 1px solid var(--pill-bd);
    border-radius: 11px;
    background: var(--bg);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
    text-align: left;
  }
  .site-signin .account-menu[hidden] { display: none; }
  .site-signin .account-menu button {
    width: 100%;
    text-align: left;
    cursor: pointer;
    font: 500 0.9rem/1 "Space Grotesk", system-ui, sans-serif;
    color: var(--fg);
    border: 0;
    background: transparent;
    padding: 0.5rem 0.7rem;
    border-radius: 8px;
  }
  .site-signin .account-menu button:hover { background: var(--pill-bg); color: var(--accent); }
  /* At phone width the handle gives up room before the page does, so the pill
     narrows and the name ellipses rather than pushing the row into a wrap. */
  @media (max-width: 30rem) {
    .site-signin .account-trigger { max-width: 9.5rem; }
  }
  /* nav:end */

  .stage {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(28px, 8vh, 72px) clamp(20px, 6vw, 56px);
    overflow: clip;
  }

  /* The flow field is decoration: it sits under every piece of content and
     never takes a click, so the CTA and the banner above it stay live. It
     spans the whole page rather than only the stage, so the diagonals reach
     the top edge with no bare band above them behind the banner and Sign in.

     It sits at z-index 0, not -1. `body` paints an opaque `background`, and a
     negative z-index puts this canvas behind its own parent's background --
     which does not render the diagonals faintly, it hides them completely. The
     foreground therefore earns its own stacking order below rather than
     relying on the field being pushed beneath the page. */
  #field {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    /* fade the diagonals out into the page floor */
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 220px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 220px), transparent 100%);
  }

  .lockup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.2vw, 26px);
  }
  .lockup .logo {
    height: clamp(70px, 15vw, 150px);
    width: auto;
    display: block;
  }

  .wordmark {
    font-family: "Bungee", "Space Grotesk", system-ui, sans-serif;
    font-size: clamp(38px, 9vw, 92px);
    line-height: 0.9;
    letter-spacing: 0.01em;
    color: var(--fg);
    display: flex;
  }
  /* Each letter rises in on its own, a beat apart, the way the Aiur wordmark
     does. The transform never changes layout, so the keep-out box the flow
     field measures is the same before, during and after the entrance. */
  .wordmark span {
    display: inline-block;
    transform: translateY(18px);
    opacity: 0;
    animation: rise 0.7s cubic-bezier(.2,.85,.3,1) forwards;
  }
  .wordmark span:nth-child(1) { animation-delay: .35s; }
  .wordmark span:nth-child(2) { animation-delay: .45s; }
  .wordmark span:nth-child(3) { animation-delay: .55s; }
  .wordmark span:nth-child(4) { animation-delay: .65s; }
  .wordmark span:nth-child(5) { animation-delay: .75s; }
  .wordmark span:nth-child(6) { animation-delay: .85s; }
  @keyframes rise {
    to { transform: translateY(0); opacity: 1; }
  }

  /* One copyable line, in the shape of the Aiur install box: a bordered pill
     holding the prompt a person pastes into their agent, and a copy button.
     There is one line and no package-manager tabs, so no tab strip. */
  .prompt-hint {
    margin-top: clamp(26px, 5vh, 44px);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .install-box {
    display: flex;
    align-items: stretch;
    max-width: 100%;
    margin-top: 10px;
    border: 1px solid var(--pill-bd);
    background: var(--pill-bg);
    border-radius: 11px;
    backdrop-filter: blur(3px);
  }
  .install {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
    padding: 11px 10px 11px 18px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: clamp(12.5px, 1.6vw, 14px);
    color: var(--fg);
    text-align: left;
  }
  .install .prompt { color: var(--accent); flex: none; }
  .install .cmd {
    letter-spacing: 0.01em;
    overflow-wrap: anywhere;
  }
  .install .copy {
    flex: none;
    position: relative;
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 7px;
    transition: background-color .2s, color .2s;
  }
  .install .copy:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 9%, transparent); }
  .install .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .install .copy svg { width: 15px; height: 15px; }
  .install .copy.copied { color: var(--accent); }
  /* "Copied" is announced to a screen reader and shown as a small label above
     the button, so the confirmation is not colour alone. */
  .copy-status {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translate(-50%, 4px);
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--fg);
    color: var(--bg);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .copy.copied .copy-status { opacity: 1; transform: translate(-50%, 0); }

  .what {
    margin-top: clamp(30px, 6vh, 54px);
    max-width: 34ch;
    text-wrap: balance;
    font-size: clamp(18px, 2.7vw, 25px);
    font-weight: 500;
    line-height: 1.42;
    letter-spacing: -0.012em;
    color: var(--fg);
  }
  .what .hl { color: var(--accent); }

  /* The one action on the page. The prompt above it is a bordered monospace
     pill, so the action takes the opposite shape: a solid accent fill, no
     border, a full radius and the page's sans face. It reads as a button at
     rest, not only under a cursor that a touch device never has. */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-top: clamp(30px, 6vh, 52px);
    max-width: 100%;
    padding: 13px 22px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--accent);
    color: var(--bg);
    font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
    font-weight: 500;
    font-size: clamp(13px, 1.8vw, 15px);
    letter-spacing: 0.01em;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  /* Mixing toward the foreground darkens in light and brightens in dark, so
     one rule covers both themes. */
  .cta:hover {
    background: color-mix(in srgb, var(--accent) 82%, var(--fg));
  }
  .cta svg {
    width: 15px;
    height: 15px;
    flex: none;
    transition: transform 0.2s ease;
  }
  .cta:hover svg { transform: translateX(3px); }
  .cta:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  .aside {
    margin-top: clamp(22px, 4vh, 34px);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: color-mix(in srgb, var(--muted) 78%, transparent);
  }
  .aside a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .aside a:hover { color: var(--fg); }

  @media (prefers-reduced-motion: reduce) {
    .cta, .cta svg, .install .copy, .copy-status { transition: none; }
    /* show the wordmark at once instead of leaving the letters hidden */
    .wordmark span { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <aside class="banner" id="aiur-banner" hidden>
    <span><b>Introducing Aiur:</b> AI Unit Runtime for Executors</span>
    <a href="https://aiur.team">Learn More</a>
    <button class="banner-close" id="aiur-banner-close" type="button" aria-label="Dismiss announcement">&#215;</button>
  </aside>
  <div class="site-signin">
    <form id="siteSignin" method="post" action="/api/hosted/auth/start">
      <!-- Somebody signing in from the splash has nothing to approve yet, so they
           land on the onboarding page, which explains the flow. #236 landed them
           on this same splash as an interim measure; this replaces it. A
           publication being approved arrives on /publish/authorize through its own
           link, not through this button. A `?destination=` a failed sign-in
           carried back is applied to this field below, so a retry keeps its
           intent; the server validates it again and is the authority. -->
      <input type="hidden" name="destination" id="siteSigninDest" value="/welcome">
      <button id="siteSigninBtn" type="submit" disabled>Sign in</button>
    </form>
    <!-- nav:start -->
    <!-- The signed-in half of the nav, hidden until the session bootstrap below
         says somebody is signed in. It starts hidden rather than starting shown
         and being emptied, so an anonymous visitor and a crawler never see an
         account pill with nothing in it.

         Log out is a real `<form method="post">`, not a link: the route refuses
         GET, and the browser has to *navigate* for the identity tenant to end
         its own session as well as Archon's. It carries the session-bound CSRF
         token the bootstrap reads out of `/api/hosted/session`, because a form
         cannot set the header a `fetch` caller would use. -->
    <div class="site-account" id="siteAccount" hidden>
      <button class="account-trigger" id="siteAccountBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="siteAccountMenu">
        <img class="account-avatar" id="siteAccountAvatar" alt="" width="26" height="26" hidden>
        <span class="account-initial" id="siteAccountInitial" aria-hidden="true"></span>
        <span class="account-name" id="siteAccountName"></span>
      </button>
      <div class="account-menu" id="siteAccountMenu" hidden>
        <form method="post" action="/api/hosted/auth/logout">
          <input type="hidden" name="csrfToken" id="siteLogoutCsrf" value="">
          <button type="submit">Log out</button>
        </form>
      </div>
    </div>
    <!-- nav:end -->
    <!-- The splash is the single sign-in entry, so a sign-in that failed returns
         here with `?status=<word>` rather than dead-ending on /login. The word is
         from a closed set the server controls; anything else is ignored, so the
         query string can never put chosen text on the page. -->
    <p class="signin-status" id="siteSigninStatus" role="status" aria-live="polite"></p>
  </div>
  <script>
  (() => {
    "use strict";
    const form = document.getElementById("siteSignin");
    const btn = document.getElementById("siteSigninBtn");
    const dest = document.getElementById("siteSigninDest");
    const statusEl = document.getElementById("siteSigninStatus");

    /* nav-script:start */
    const account = document.getElementById("siteAccount");
    const accountBtn = document.getElementById("siteAccountBtn");
    const accountMenu = document.getElementById("siteAccountMenu");
    const accountName = document.getElementById("siteAccountName");
    const accountAvatar = document.getElementById("siteAccountAvatar");
    const accountInitial = document.getElementById("siteAccountInitial");
    const logoutCsrf = document.getElementById("siteLogoutCsrf");

    function closeMenu() {
      accountMenu.hidden = true;
      accountBtn.setAttribute("aria-expanded", "false");
    }
    function openMenu() {
      accountMenu.hidden = false;
      accountBtn.setAttribute("aria-expanded", "true");
      const first = accountMenu.querySelector("button");
      if (first !== null) first.focus();
    }
    accountBtn.addEventListener("click", () => { if (accountMenu.hidden) openMenu(); else closeMenu(); });
    /* A menu that only closes by clicking its own trigger is a menu people leave
       open over the page. Escape returns focus to the trigger; a click anywhere
       outside dismisses it. */
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !accountMenu.hidden) { closeMenu(); accountBtn.focus(); }
    });
    document.addEventListener("click", (event) => {
      if (!accountMenu.hidden && !account.contains(event.target)) closeMenu();
    });
    /* A broken image is worse than no image: an avatar host that is unreachable,
       or one the page's img-src does not allow, falls back to the initial rather
       than leaving a torn-page icon in the nav. */
    accountAvatar.addEventListener("error", () => {
      accountAvatar.hidden = true;
      accountAvatar.removeAttribute("src");
      accountInitial.hidden = false;
    });

    /* Everything the session says is written with `textContent` and `.value`,
       never as markup: `login` and `avatarUrl` come from an identity provider,
       and this is the boundary where they stop being able to become HTML. */
    function showAccount(session) {
      const login = typeof session.login === "string" ? session.login : "";
      accountName.textContent = login;
      accountInitial.textContent = [...login][0] || "?";
      accountBtn.setAttribute("aria-label", "Account menu for " + login);
      logoutCsrf.value = typeof session.csrfToken === "string" ? session.csrfToken : "";
      if (typeof session.avatarUrl === "string" && session.avatarUrl !== "") {
        accountAvatar.src = session.avatarUrl;
        accountAvatar.hidden = false;
        accountInitial.hidden = true;
      } else {
        accountAvatar.hidden = true;
        accountInitial.hidden = false;
      }
      closeMenu();
      form.hidden = true;
      account.hidden = false;
    }
    function showSignedOut() {
      closeMenu();
      logoutCsrf.value = "";
      account.hidden = true;
      form.hidden = false;
    }
    /* nav-script:end */

    /* The closed set of words the start route and callback may land back here
       with, each mapped to a fixed message. A word not in the set shows nothing,
       so the query string cannot become a way to render arbitrary text. */
    const LANDING = {
      denied: "You cancelled the sign-in. You can try again.",
      expired: "That sign-in attempt expired or could not be verified. Please try again.",
      unavailable: "Archon could not reach the sign-in service just now. Please try again in a moment.",
      verify_email: "Confirm your email address with your identity provider, then sign in again."
    };

    /* The same shapes the server accepts, so a carried `?destination=` is only
       ever re-applied to the form when it is a legal one; the server validates it
       again regardless. `/` and an empty value both mean the onboarding default,
       which the field already holds. */
    const RESERVED = new Set(["admin", "assets", "login", "invite", "publish", "docs", "api", "welcome", "_assets", "_render"]);
    function destinationAllowed(value) {
      if (value === "/publish/authorize" || value === "/welcome" || value === "/admin") return true;
      if (/^\/docs\/[0-9a-f]{32}$/.test(value)) return true;
      const slug = /^\/([a-z0-9-]{1,64})\/$/.exec(value);
      return slug !== null && !RESERVED.has(slug[1]);
    }

    try {
      const params = new URL(window.location.href).searchParams;
      const message = LANDING[params.get("status")];
      if (message !== undefined) statusEl.textContent = message;
      const wanted = params.get("destination");
      if (wanted !== null && destinationAllowed(wanted)) dest.value = wanted;
    } catch (error) { /* a URL the browser will not parse leaves the defaults */ }

    let ready = false;
    async function boot() {
      ready = false;
      btn.disabled = true;
      let session;
      try {
        const r = await fetch("/api/hosted/session", { credentials: "same-origin", headers: { accept: "application/json" } });
        if (!r.ok) throw new Error("unavailable");
        session = await r.json();
      } catch {
        showSignedOut();
        btn.textContent = "Sign in — retry";
        btn.disabled = false;
        return;
      }
      /* The one fetch answers both questions: whether the sign-in service is
         reachable, which is what the button was already waiting on, and who the
         visitor is, which is what the nav draws. A second request for the second
         answer would be the same request twice. */
      if (session !== null && typeof session === "object" && session.authenticated === true) {
        showAccount(session);
      } else {
        showSignedOut();
      }
      ready = true;
      btn.textContent = "Sign in";
      btn.disabled = false;
    }
    form.addEventListener("submit", (e) => { if (!ready) { e.preventDefault(); boot(); } });
    boot();
  })();
  </script>

<script>
  /* Copy the agent prompt. The text copied is the exact content of the line on
     the page, so the two cannot disagree. When the clipboard API is refused
     (no secure context, or permission denied) the line is selected instead so
     a keyboard copy still works, and no "Copied" is claimed. */
  (function () {
    var btn = document.getElementById("copyBtn");
    var line = document.getElementById("agentPrompt");
    var status = document.getElementById("copyStatus");
    if (!btn || !line || !status) return;

    var timer = 0;
    function confirm() {
      btn.classList.add("copied");
      status.textContent = "Copied";
      clearTimeout(timer);
      timer = setTimeout(function () {
        btn.classList.remove("copied");
        status.textContent = "";
      }, 1300);
    }
    function selectLine() {
      try {
        var range = document.createRange();
        range.selectNodeContents(line);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      } catch (error) { /* nothing more to offer */ }
    }

    btn.addEventListener("click", function () {
      var text = line.textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(confirm, selectLine);
      } else {
        selectLine();
      }
    });
  })();
</script>

<script>
  /* The banner ships hidden and is revealed only once we know it was not
     dismissed, so a reader who dismissed it never sees it flash back. Every
     storage access is guarded: a browser with site data blocked throws on
     access, and the banner must still work there — it simply shows each time. */
  (function () {
    var KEY = "archon.banner.aiur.dismissed";
    var el = document.getElementById("aiur-banner");
    var close = document.getElementById("aiur-banner-close");
    if (!el || !close) return;

    var dismissed = false;
    try { dismissed = localStorage.getItem(KEY) === "1"; } catch (error) { /* unreadable storage shows the banner */ }
    if (!dismissed) el.hidden = false;

    close.addEventListener("click", function () {
      el.hidden = true;
      try { localStorage.setItem(KEY, "1"); } catch (error) { /* dismissal is then per-page-load */ }
    });
  })();
</script>

<script>
  /* Diagonal flow field behind the splash, bending around the lockup and the
     copy. Ported from the Aiur site's TypeScript module to plain script,
     because this page has no build step and must not grow one.
     It is pure decoration: the canvas takes no pointer events, sits at z-index
     0 under every element, and carries no meaning a reader would miss. */
  (function () {
    var canvas = document.getElementById("field");
    var stage = document.querySelector(".stage");
    var ctx = canvas ? canvas.getContext("2d") : null;
    if (!canvas || !stage || !ctx) return;

    var ANGLE = -118 * (Math.PI / 180); // direction of the lines
    var dir = { x: Math.cos(ANGLE), y: Math.sin(ANGLE) };
    var nrm = { x: -dir.y, y: dir.x }; // perpendicular (spacing axis)
    var SPACING = 23; // px between lines
    var STEP = 7; // sampling step along a line
    var GAP = 9; // clearance kept around the content

    var W = 0, H = 0, DPR = 1;
    var lines = [];
    var obstacles = [];
    var progress = 1; // entrance progress 0..1

    var motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
    var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function roundRectSDF(px, py, ob) {
      var qx = Math.abs(px - ob.cx) - (ob.hx - ob.r);
      var qy = Math.abs(py - ob.cy) - (ob.hy - ob.r);
      var ax = Math.max(qx, 0);
      var ay = Math.max(qy, 0);
      return Math.sqrt(ax * ax + ay * ay) + Math.min(Math.max(qx, qy), 0) - ob.r;
    }

    function pointHidden(p) {
      for (var i = 0; i < obstacles.length; i++) {
        if (roundRectSDF(p.x, p.y, obstacles[i]) < GAP) return true;
      }
      return false;
    }

    function buildObstacles() {
      obstacles = [];
      var crect = canvas.getBoundingClientRect();
      var els = document.querySelectorAll(".keepout");
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        var r = el.getBoundingClientRect();
        if (!r.width) continue;
        var isLogo = el.classList.contains("logo");
        var padX = isLogo ? 3 : 9;
        var padY = isLogo ? 1 : 6;
        var hx = r.width / 2 + padX;
        var hy = r.height / 2 + padY;
        obstacles.push({
          cx: r.left - crect.left + r.width / 2,
          cy: r.top - crect.top + r.height / 2,
          hx: hx,
          hy: hy,
          r: Math.min(hx, hy) * (isLogo ? 0.95 : 0.55)
        });
      }
    }

    function buildLines() {
      lines = [];
      if (!W || !H) return;
      var cx = W / 2;
      var cy = H / 2;
      var diag = Math.sqrt(W * W + H * H);
      var half = diag / 2 + SPACING;
      var nLines = Math.ceil(diag / SPACING) + 2;
      for (var i = -nLines; i <= nLines; i++) {
        var off = i * SPACING;
        var ax = cx + nrm.x * off;
        var ay = cy + nrm.y * off;
        var pts = [];
        for (var t = -half; t <= half; t += STEP) {
          var p = { x: ax + dir.x * t, y: ay + dir.y * t, on: true };
          p.on = !pointHidden(p);
          pts.push(p);
        }
        lines.push({ pts: pts, key: ax + ay, t: 0 });
      }
      var mn = Infinity, mx = -Infinity;
      for (var j = 0; j < lines.length; j++) {
        if (lines[j].key < mn) mn = lines[j].key;
        if (lines[j].key > mx) mx = lines[j].key;
      }
      var span = mx - mn || 1;
      for (var k = 0; k < lines.length; k++) lines[k].t = (lines[k].key - mn) / span;
    }

    function lineColor() {
      return getComputedStyle(document.body).getPropertyValue("--line").trim();
    }

    function draw() {
      if (!W) return;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = lineColor();
      ctx.lineWidth = 1;
      ctx.lineCap = "round";
      var STAG = 0.32; // fraction of the timeline used to stagger the lines
      for (var i = 0; i < lines.length; i++) {
        var L = lines[i];
        var local = (progress - L.t * STAG) / (1 - STAG);
        local = local < 0 ? 0 : local > 1 ? 1 : local;
        if (local <= 0) continue;
        ctx.globalAlpha = local;
        ctx.beginPath();
        var pen = false;
        for (var j = 0; j < L.pts.length; j++) {
          var p = L.pts[j];
          if (!p.on) { pen = false; continue; }
          if (!pen) { ctx.moveTo(p.x, p.y); pen = true; }
          else { ctx.lineTo(p.x, p.y); }
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      // The canvas spans the whole page (inset:0 on the body), so measure the
      // canvas itself rather than the stage: the field reaches the top edge,
      // above the banner and Sign in, with no bare band.
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      if (!W || !H) return;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildObstacles();
      buildLines();
      draw();
    }

    function rebuild() {
      buildObstacles();
      buildLines();
      draw();
    }

    function runEntrance() {
      var startTs = null;
      var DUR = 1500;
      progress = 0;
      requestAnimationFrame(function frame(ts) {
        if (startTs === null) startTs = ts;
        var e = (ts - startTs) / DUR;
        progress = e >= 1 ? 1 : 1 - Math.pow(1 - e, 3); // easeOutCubic
        draw();
        if (e < 1) requestAnimationFrame(frame);
      });
    }

    var started = false;
    function start() {
      if (started) return;
      started = true;
      resize();
      /* A reader who asked for reduced motion gets the finished field drawn in
         one pass rather than the staggered entrance. */
      if (motionQuery.matches) {
        progress = 1;
        draw();
      } else {
        runEntrance();
      }
    }

    // Fonts shift the wordmark's metrics, which moves a keep-out box.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(rebuild).catch(function () { /* metrics stay as measured */ });
    }

    // The page resizes when the viewport changes and when the banner is
    // dismissed, so observe the body (which the canvas spans) rather than only
    // the window.
    var rzTimer = 0;
    function scheduleResize() {
      clearTimeout(rzTimer);
      rzTimer = setTimeout(resize, 120);
    }
    if (window.ResizeObserver) {
      new ResizeObserver(scheduleResize).observe(document.body);
    } else {
      window.addEventListener("resize", scheduleResize);
    }

    // Follow a live theme switch: the line colour is a themed token.
    if (darkQuery.addEventListener) darkQuery.addEventListener("change", draw);

    window.addEventListener("load", start);
    if (document.readyState === "complete") start();
  })();
</script>
